[project]
name = "mdconvertor"
version = "0.1.0"
description = "A tiny CLI wrapper around microsoft/markitdown: convert a file to Markdown."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]>=0.1.6",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
mdconv = "mdconvertor.cli:main"
mdconv-mcp = "mdconvertor.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "mcp>=2,<3",
]

[tool.uv]
# markitdown[all] pins azure-ai-contentunderstanding>=1.2.0b1, which is only
# published as a pre-release; allow pre-releases where a dep explicitly asks.
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdconvertor"]
